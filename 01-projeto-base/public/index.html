<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini-Prontuário</title>

  <!-- Bootstrap 5.3 via CDN: grid, utilitários e componentes base -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous" />

  <!-- Nossa camada: a ordem importa. Tokens -> base -> componentes -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>

<body>
  <header class="app-header">
    <div class="container">
      <p class="app-header__eyebrow">IFPI · Programação para Internet II</p>
      <h1 class="app-header__title">Mini-Prontuário</h1>
    </div>
  </header>

  <main class="container app-main">
    <section aria-label="Novo paciente" class="patient-form">
      <h2 class="section-heading__title">Novo paciente</h2>

      <form id="patient-form" class="patient-form__fields">
        <div class="patient-form__field">
          <label for="patient-attachment" class="patient-form__label">
            Foto do paciente (opcional)
          </label>

          <div class="patient-form__dropzone" id="patient-photo-dropzone">
            <div class="patient-form__dropzone-preview" id="patient-photo-preview">
              <span class="patient-form__dropzone-icon" aria-hidden="true">🖼</span>
            </div>
            <div class="patient-form__dropzone-text">
              <p class="patient-form__dropzone-title" id="patient-photo-title">
                Clique para anexar uma foto
              </p>
              <p class="patient-form__dropzone-hint">JPEG ou PNG</p>
            </div>
            <input
              type="file"
              id="patient-attachment"
              name="attachment"
              accept=".jpg,.jpeg,.png,image/jpeg,image/png"
            />
          </div>
        </div>

        <div class="patient-form__field">
          <label for="patient-name" class="patient-form__label">
            Nome completo
          </label>
          <input type="text" id="patient-name" name="name" class="patient-form__input" placeholder="Ex.: Maria da Silva" />
        </div>

        <div class="patient-form__group">
          <div class="patient-form__field">
            <label for="patient-birth-date" class="patient-form__label">
              Data de nascimento
            </label>
            <input type="date" id="patient-birth-date" name="birthDate" class="patient-form__input" />
          </div>

          <div class="patient-form__field">
            <label for="patient-national-id" class="patient-form__label">
              CNS
            </label>
            <input type="text" id="patient-national-id" name="nationalId" class="patient-form__input" placeholder="Cartão Nacional de Saúde" />
          </div>
        </div>

        <div class="patient-form__actions">
          <button id="save-new-patient" type="submit" class="action-button action-button--primary">
            Cadastrar
          </button>
        </div>
        
        <p id="patient-form-status" class="patient-form__status" hidden></p>
        <div id="patient-form-error" class="patient-form__feedback patient-form__feedback--error" role="alert" hidden>
        </div>
      </form>
    </section>

    <!-- ------------------------------------------------------
         Barra de filtros.
         Nenhum evento é registrado aqui: isso é papel do app.js.
         O HTML descreve a ESTRUTURA, não o comportamento.
    ------------------------------------------------------- -->
    <section class="toolbar" aria-label="Filtros da lista de pacientes">
      <div class="toolbar__search">
        <label class="form-label" for="search-input">Buscar paciente</label>
        <input
          id="search-input"
          class="form-control form-control-lg"
          type="search"
          placeholder="Digite parte do nome…"
          autocomplete="off" />
      </div>

      <div class="toolbar__filter form-check form-switch">
        <input class="form-check-input" type="checkbox" id="only-active-input" />
        <label class="form-check-label" for="only-active-input">
          Mostrar apenas pacientes ativos
        </label>
      </div>
    </section>

    <p id="result-counter" class="result-counter" aria-live="polite"></p>

    <div id="form-error-container"></div>
    <!-- A lista é desenhada por render.js. Ela nasce vazia de propósito. -->
    <ul id="patient-list" class="patient-list"></ul>

  </main>

  <!-- type="module" habilita import/export no navegador -->
  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/render.js"></script>
</body>
</html>
