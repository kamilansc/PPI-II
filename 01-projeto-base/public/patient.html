<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Prontuário</title>

  <!-- Bootstrap 5.3 via CDN: grid, utilitários e componentes base -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous" />

  <!-- Nossa camada: a ordem importa. Tokens -> base -> componentes -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/patient-detail.css" />

</head>
<body>
  <header class="app-header">
    <div class="container">
      <p class="app-header__eyebrow">IFPI · Programação para Internet II</p>
      <h1 class="app-header__title">Mini-Prontuário</h1>
    </div>
  </header>

  <main class="container app-main">
    <a class="breadcrumb-link" href="./index.html">&larr; Voltar ao Mini-Prontuário</a>
    
    <section id="patient-summary" class="patient-summary" hidden aria-label="Dados do paciente">
      <!-- <div class="patient-summary__body">
        <div id="patient-summary__status"></div>
        
        <div id="patient-summary__heading" class="patient-summary__heading"></div>

        <div id="patient-summary__fields" class="patient-summary__fields"></div>
      </div>
        
      <div id="patient-summary__actions" class="patient-summary__actions">
          <button type="button" class="action-button action-button--primary"
                  data-bs-toggle="modal" data-bs-target="#new-encounter-modal">
            + Nova consulta
          </button>
          <button type="button" class="action-button action-button--ghost">Editar paciente</button>
      </div> -->
    </section>

    <section aria-label="Atendimentos do paciente">
      <div class="section-heading">
        <h3 id="section-heading__title" class="section-heading__title" hidden>Atendimentos</h3>
        <p class="section-heading__count"></p>
      </div>

      <ul id="encounter-list" class="encounter-list"></ul>
    </section>

    <div class="modal fade" id="new-encounter-modal" tabindex="-1" aria-labelledby="new-encounter-modal-title" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="new-encounter-modal-title">Nova consulta</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          
          <form id="new-encounter-form" class="encounter-form" novalidate>
            <div class="modal-body">
              <div id="encounter-form__error" class="encounter-form__error"></div>

              <div class="mb-3">
                <label for="encounter-form__chief-complaint" class="form-label">Queixa principal</label>
                <input type="text" class="form-control" id="encounter-form__chief-complaint" name="chiefComplaint" required>
              </div>

              <div class="mb-3">
                <label for="encounter-form__notes" class="form-label">Observações (opcional)</label>
                <textarea class="form-control" id="encounter-form__notes" name="notes" rows="3"></textarea>
              </div>
  
              <div class="mb-3">
                <label for="encounter-form__started-at" class="form-label">Data e hora</label>
                <input type="datetime-local" class="form-control" id="encounter-form__started-at" name="startedAt" required>
              </div>
            </div>
                    
            <div class="modal-footer">
              <button type="button" class="action-button action-button--ghost" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="action-button action-button--primary">Salvar consulta</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <!-- type="module" habilita import/export no navegador -->
  <script type="module" src="./js/patient/app.js"></script>
</body>
</html>
